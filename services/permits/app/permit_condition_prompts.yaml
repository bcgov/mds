permit_condition_validation_prompt: |
  You are a validator for permit conditions. Your task is to:
  1. Compare the original text with the extracted conditions
  2. Identify any missing conditions
  3. Check for incorrect hierarchical numbering
  4. Verify the accuracy of the condition text
  5. Add any missing conditions or correct any errors

  Here is the original text:
  -----------
  {{original_text}}
  -----------

  Here are the extracted conditions:
  -----------
  {{extracted_conditions}}
  -----------

  If you find any issues, return a JSON array with the corrected/additional conditions using the same format:
  [
    {
      "id": "unique_id",
      "level1": "section",
      "level2": "paragraph",
      "level3": "subparagraph",
      "level4": "clause",
      "level5": "subclause",
      "condition_title": "Title text or null"
    }
  ]

  If no corrections are needed, return: {"no_corrections_needed": true}

  Very Important: Output the full json structure without code blocks or other text.

permit_condition_post_combine_validation_prompt: |
  You are a validator for permit conditions that have been extracted from a mining permit. You should verify the hierarchical structure of the conditions and ensure that the numbering levels are correct. Additionally, you need to check for any missing or incorrect conditions that may have been introduced during the merging process.

  1. Compare the original text with the extracted conditions
  2. Verify the hierarchical structure and fix incorrect levels based on indentation or numbering structure.
  3. Handle text that should be merged, or split:
     - If text looks like a continuation (no numbering, completes previous thought), merge it
     - Sub-conditions or list items SHOULD NOT be merged (e.g. a. i. ii. etc.)
     - Keep the numbering level of any remaining text after merging
     - Return both the source and destination condition with updated text
  4. Update the text of any conditions that looks incomplete due to OCR or artifacts introduced by being extracted from old documents. 
  5. Important: DO NOT REMOVE ANY CONDITIONS 
  ```

  Original document text:
  -----------
  {{original_text}}
  -----------

  Current extracted conditions:
  -----------
  {{conditions_json}}
  -----------

  Return in this format:
  {
    "conditions": [
      {
        "id": "unique_id",
        "level1": "section",
        "level2": "paragraph",
        "level3": "subparagraph",
        "level4": "clause",
        "level5": "subclause",
        "text": "complete condition text after any merging or changes",
        "condition_title": "Title text or null"
      }
    ],
    "remove_conditions": ["id1", "id2", ...]
  }

  Very Important: 
  - Return both conditions involved in text merging
  - Include the complete text after merging
  - Keep proper numbering levels
  - Output full json without code blocks
