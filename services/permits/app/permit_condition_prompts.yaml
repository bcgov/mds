system_prompt: |
  You are a helpful AI assistant that answer questions about paragraphs in a mining permit. You answer exactly what is asked for and return it in a json format.

permit_condition_search_prompt:
  system: You are an expert assistant that helps users retrieve and reason about permit conditions in the mining industry.
  user: |
    When answering questions, use only the information provided in the sources and cite them using square brackets with the prefix "doc" (e.g., [doc:1]).

    Follow these guidelines:
    1. Focus on directly answering the user's question using the most relevant permit conditions
    2. Use context from parent, sibling, or child conditions only when it helps clarify the meaning or implications of the main condition
    3. If a report requirement exists, mention it as it's an important compliance requirement
    4. Present information in a clear, concise manner
    5. Use Markdown blockquotes (>) for direct quotes from permit conditions
    6. Always maintain the exact wording from the source documents
    7. If you're unsure or the information isn't in the sources, say so
    8. Wherever possible, provide the information itself such that the full permit condition is shown as a direct quote
    9. Output the results as markdown, with appropriate headings.

    Question: {{question}}

    """ <documents>
    {% for document in documents %}
        ID: {{ document.id }}
        {% if document.meta.report_name %}
        Report Required: {{ document.meta.report_name | tojson}}
        {% endif %}

        Main Condition:
        > {{ document.content | tojson}}
        
        {% if document.meta.context %}
            {# Only include context if it adds value to understanding the condition #}
            {% if document.meta.context.parent_contexts %}
                {% for level_num in range(1, document.meta.context.parent_contexts|length + 1) %}
                    {% set level = document.meta.context.parent_contexts["level_" ~ level_num] %}
                    {% if level.content and level.content|length > 0 %}
        Related Context:
        > {{ level.content | tojson}}
                    {% endif %}
                {% endfor %}
            {% endif %}

            {# Include children/siblings only if they provide essential context #}
            {% if document.meta.context.child_contexts or document.meta.context.sibling_contexts %}
        Additional Context:
                {% if document.meta.context.sibling_contexts.previous %}
                    {% for sibling in document.meta.context.sibling_contexts.previous %}
        > {{ sibling.content | tojson}}
                    {% endfor %}
                {% endif %}
                {% if document.meta.context.sibling_contexts.next %}
                    {% for sibling in document.meta.context.sibling_contexts.next %}
        > {{ sibling.content | tojson}}
                    {% endfor %}
                {% endif %}
                {% if document.meta.context.child_contexts %}
                    {% for child in document.meta.context.child_contexts %}
        > {{ child.content | tojson}}
                    {% endfor %}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endfor %}
    </documents> """

permit_document_prompt_meta_questions: |
  -----------
  {{documents[0].content}}

user_prompt_meta_questions: |
  You are given a list of paragraphs extracted from a mining permit. These paragraphs may have a reporting requirement. Your task is to identify the paragraphs that have a reporting requirement.
  A reporting requirement means that a report is mentioned that needs submission, such as an annual report, an entity needs to be notified when something happens, updates or results needs to be submitted or filed to an entity. Please consider synonyms of those terms as well to a reporting requirement. 
  Some paragraphs may mention "all reports" under the permit, this should not be considered as a reporting requirement as it does not mentions a specific report.

  For each of the identified paragraphs that require a report you need to extract the following information:

  "require_report": Does this paragraph require a report to be submitted? (type: boolean)
  "due_date": When is the report due date? (type: date)
  "recurring": Is this a recurring report requirement? (type: boolean)
  "frequency": Frequency of the report - "Yearly", "Monthly", "Quarterly", "Semi-annually", "Annually", "Bi-annually", "5 years", "As needed", "Other" (type: string)
  "mention_chief_inspector": Does this paragraph mention the Chief Inspector? (type: boolean)
  "mention_chief_permitting_officer": Does this paragraph mention the Chief Permitting Officer? (type: boolean)
  "report_name": Name of the report mentioned (if found) (type: string)


  Output should be a json blob structured as follows:
  {
    "paragraphs": [
      {
        "id": "the id of the paragraph_number",
        "meta": [
          {
            "question": "the question",
            "question_key": "the key of the question",
            "answer": "the answer"
          }
        ]
      },
      ...
    ]
  }
  Very Important: Output the full json structure without code blocks or other text. Do not output any other explanation or questions that is not in the json format.

  Here's the input (delimited by ---------)

# The following prompts are currently not in use. They are kept here for future reference.
user_prompt: |
  You will be given a csv file of textual paragraphs that represent a tree of conditions.
  Your task is to extract the hierarchical structure of these conditions, identify the paragraph numbering structure
  and what number was found within each paragraph.
  Give each level a type based on the level of hierarchy and what it represents the hirararchical structure should be represented as follows:
  section -> paragraph -> subparagraph -> clause -> subclause -> subsubclause
  The output should be formatted as a CSV object without a code block, and contain the following columns:  
    
  - id: id of the condition as found in the input  
  - type: type of the condition (section, paragraph, subparagraph, clause, subclause, subsubclause)  
  - paragraph_type: title | text - does the input text look like a title or text  
  - numbering: the numbering structure of the condition if found. (e.g A or a or 1 or ii or (a) etc)
  The input is a csv file with the following columns. The values in each column are quoted with ""
  - id: id of the condition
  - indentation: The x index of the conidtion of the page. This can be used in combination with the numbering to determine the structure.
  - text: The text of the condition. At the beginning of this is where the numbering of the condition can be found.
    
  Example output:  
    
  id,type,paragraph_type,numbering  
  49,section,title,A  
  50,paragraph,text,B  
    
  Each paragraph in the input should be included in the output.  
  Here's the CSV input (delimited by ---------)

