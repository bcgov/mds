permit_extraction_prompt2: |
  Extract the hierarchical numbering structure of conditions from a mining permit document, split each level of the hierarchy, and convert it into a flat JSON format using paragraph IDs.

  - Identify sections, conditions, and nested levels within the document.
  - Parse the hierarchical numbering structure for each condition and split each level of numbering (e.g., "A", "1", "a", "i").
  - Use paragraph IDs to uniquely identify each condition or sub-condition.
  - Assume up to a maximum of 5 levels of nesting.
  - Structure output into a flat JSON format with defined attributes.

  # Steps

  1. **Analyze the Document**:
    - Read the document to delineate sections, conditions, and their nested structures.
    - Identify numeric or alphanumeric indicators for each level (e.g., "A", "1", "a", "i").

  2. **Parse the Numbering and Split Levels**:
    - Extract and split the hierarchical numbering for each condition into up to 5 levels: `level1`, `level2`, `level3`, `level4`, and `level5`.
    - Use `null` for levels that are not applicable.

  3. **Create Unique Identifiers**:
    - Generate or extract a unique identifier (`id`) for each condition or sub-condition. This may correspond to a paragraph ID or other consistent markers in the text.

  4. **Structure as a Flat JSON**:
    - For each condition, generate a JSON object with the following attributes:
      - `"id"`: The unique identifier for the condition.
      - `"level1"`: The first level of numbering.
      - `"level2"`: The second level of numbering.
      - `"level3"`: The third level of numbering.
      - `"level4"`: The fourth level of numbering.
      - `"level5"`: The fifth level of numbering.
      - `"condition_title"`: Title of the condition, or null if it's not a title.
      - Use `null` where fields are not applicable.
      - Each condition must have level1 defined. If not available, use A as the default value

  5. **Verify Output**:
    - Cross-check the generated JSON against the original document to ensure completeness and accuracy.
    - Validate that all hierarchical structures are consistently represented in the output.

  # Output Format

  Produce the output as a flat JSON array. Each condition should be represented as a separate JSON object with the following attributes:

  ```json
  [
    {
      "id": "unique_paragraph_id",  
      "level1": "A",  
      "level2": null,  
      "level3": null,  
      "level4": null,  
      "level5": null,
      "condition_title": null
    },
    ...
  ]
  ```

  Use the format exactly as shown, replacing placeholders with extracted values.

  # Examples

  ## Example Input (Document Excerpt):
  ```
  A. General Conditions
    1. The permittee must ensure all equipment is operational.
        a. If equipment becomes non-operational, repairs must be made within 48 hours.
          i. Notify regulatory authorities immediately upon non-compliance.
    2. A signed report must be submitted annually.
  B. Environmental Standards
    1. All environmental standards outlined in section 9 must be followed.
        a. Reporting must be timely and accurate.
  ```

  ## Example Output:
  [
    {
      "id": "a5h25"",
