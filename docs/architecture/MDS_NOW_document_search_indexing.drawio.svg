  <path class="arrow" d="M657 236 L700 236"/>
  <path class="arrow" d="M815 236 L855 236"/>
  <path class="arrow" d="M970 236 L1010 236"/>
  <path class="arrow" d="M1125 236 L1165 236"/>
  <path class="arrow" d="M1280 236 L1320 236"/>
  <text x="1287" y="221" class="small">4. Push</text>
