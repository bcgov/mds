  <text x="925" y="148" text-anchor="middle" class="label">Azure DI</text>
  <text x="925" y="166" text-anchor="middle" class="small">layout model</text>

  <rect x="1160" y="125" width="130" height="50" class="ai"/>
  <text x="1225" y="148" text-anchor="middle" class="label">Azure OpenAI</text>
  <text x="1225" y="166" text-anchor="middle" class="small">embeddings</text>

  <rect x="1320" y="205" width="130" height="62" class="store"/>
  <text x="1385" y="230" text-anchor="middle" class="label">Azure AI</text>
  <text x="1385" y="250" text-anchor="middle" class="label">Search Index</text>

