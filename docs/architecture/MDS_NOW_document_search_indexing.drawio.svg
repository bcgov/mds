<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc" content="&lt;mxfile host=&quot;app.diagrams.net&quot;&gt;&lt;diagram name=&quot;NoW document search indexing&quot;&gt;&lt;mxGraphModel grid=&quot;1&quot; gridSize=&quot;10&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="title">NoW Document Search Indexing</title>
  <desc id="desc">Light theme diagram showing how Notice of Work documents are indexed for search.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .page { fill: #ffffff; }
      .zone { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.6; rx: 8; }
      .azure { fill: #f0f7ff; stroke: #60a5fa; stroke-width: 1.6; rx: 8; }
      .title { font: 700 24px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .zone-title { font: 700 14px Arial, Helvetica, sans-serif; fill: #334155; }
      .label { font: 700 15px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 400 12px Arial, Helvetica, sans-serif; fill: #334155; }
      .step { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.6; rx: 8; }
      .service { fill: #ffffff; stroke: #334155; stroke-width: 1.8; rx: 8; }
      .store { fill: #ecfdf5; stroke: #15803d; stroke-width: 1.8; rx: 8; }
      .ai { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; rx: 8; }
      .pipe { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 7 5; rx: 20; }
      .arrow { stroke: #334155; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .doc-page { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .doc-fold { fill: #e2e8f0; stroke: #334155; stroke-width: 1.4; }
      .doc-line { stroke: #2563eb; stroke-width: 3; }
      .doc-accent { fill: #16a34a; }
      .icon-label { font: 700 13px Arial, Helvetica, sans-serif; fill: #0f172a; }
    </style>
  </defs>
  <rect class="page" width="1500" height="520"/>
  <text x="50" y="50" class="title">NoW document search indexing</text>

  <rect x="50" y="85" width="520" height="330" class="zone"/>
  <text x="70" y="112" class="zone-title">BCGov OpenShift Silver Cluster</text>
  <rect x="640" y="85" width="790" height="330" class="azure"/>
  <text x="660" y="112" class="zone-title">Azure Tenant</text>

